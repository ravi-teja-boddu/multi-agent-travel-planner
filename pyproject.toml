[project]
name = "multi-agent-travel-planner"
version = "0.1.0"
description = "LangGraph multi-agent system that searches flights and hotels, plans itineraries and answers travel questions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-tavily>=0.2,<1",
    "tavily-python>=0.7",
    "deepagents>=0.7,<1",
    "google-search-results>=2.4,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["travel_planner"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
